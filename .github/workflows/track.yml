name: Track Stack Exchange

on:
  push:
    # main only — an unfiltered push trigger runs the tracker on every branch,
    # committing data onto Dependabot PRs and burning unauthenticated API quota
    # (Dependabot-triggered runs don't see the STACKEXCHANGE_KEY secret).
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run weekly on Mondays
    # Using a non-round minute to avoid top-of-hour cron spike
    - cron: '37 13 * * 1'

permissions:
  contents: write

# Never let a scheduled run and a push-triggered run commit/push at the same
# time — queue the second one instead of racing on the branch.
concurrency:
  group: track-${{ github.ref }}
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Track Stack Exchange activity
        # --no-dev keeps the production run lean (no pytest/ruff install).
        run: uv run --no-dev track.py
        env:
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
      - name: Commit and push if changed
        run: |-
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date -u)
          git commit -m "Latest data: ${timestamp}" || exit 0
          git pull --rebase
          git push
